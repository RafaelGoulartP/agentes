http_port 3128
visible_hostname laboratorio-egress
pid_filename /run/squid/squid.pid

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Produção é bloqueada mesmo se a lista permitida mudar.
acl producao dstdomain "/tmp/proibidos.txt"
http_access deny producao
acl extras dstdomain "/tmp/extras.txt"
http_access allow allowed_domains
http_access allow extras
http_access deny all

access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
cache deny all


# Limites contra tempestade de reconexões (16/10/2026): com os padrões (25 tentativas por requisição) um
# cliente reconectando sem parar multiplicava as conexões de saída e esgotou as portas do Windows.
forward_max_tries 3
connect_retries 0
connect_timeout 15 seconds
